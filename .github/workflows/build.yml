name: Build, Sign, and Publish ObservatorySafety MSIs

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Generate MSI version
      shell: pwsh
      run: |
        $version = "1.0.$($env:GITHUB_RUN_NUMBER).0"
        echo "MSI_VERSION=$version" >> $env:GITHUB_ENV
        Write-Host "MSI Version: $version"

    - name: Patch WiX Product Versions
      shell: pwsh
      run: |
        $files = @(
          "wix/Product.Service.wxs",
          "wix/Product.Watchdog.wxs"
        )

        foreach ($file in $files) {
          Write-Host "Patching version in $file to $env:MSI_VERSION"

          $content = Get-Content $file -Raw
          $newContent = $content -replace 'Version="1.0.0.0"', "Version=""$env:MSI_VERSION"""
          [System.IO.File]::WriteAllText($file, $newContent, (New-Object System.Text.UTF8Encoding($false)))
        }

    - name: Install WiX Toolset 3.14
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe -OutFile wix314.exe
        Start-Process .\wix314.exe -ArgumentList "/quiet" -Wait
        echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

    - name: Restore dependencies
      shell: pwsh
      run: |
        dotnet restore src/ObservatorySafety.Service/ObservatorySafety.Service.csproj
        dotnet restore src/ObservatorySafety.Watchdog/ObservatorySafety.Watchdog.csproj

    - name: Build Service
      shell: pwsh
      run: |
        dotnet build src/ObservatorySafety.Service/ObservatorySafety.Service.csproj `
          --configuration Release `
          /p:Version=$env:MSI_VERSION `
          /p:FileVersion=$env:MSI_VERSION `
          /p:AssemblyVersion=$env:MSI_VERSION

    - name: Build Watchdog
      shell: pwsh
      run: |
        dotnet build src/ObservatorySafety.Watchdog/ObservatorySafety.Watchdog.csproj `
          --configuration Release `
          /p:Version=$env:MSI_VERSION `
          /p:FileVersion=$env:MSI_VERSION `
          /p:AssemblyVersion=$env:MSI_VERSION

    - name: Publish Service (MSI loose files)
      shell: pwsh
      run: |
        dotnet publish src/ObservatorySafety.Service/ObservatorySafety.Service.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          /p:Version=$env:MSI_VERSION `
          /p:FileVersion=$env:MSI_VERSION `
          /p:AssemblyVersion=$env:MSI_VERSION `
          /p:PublishSingleFile=false `
          --output src/ObservatorySafety.Service/publish-msi

    - name: Publish Watchdog (MSI loose files)
      shell: pwsh
      run: |
        dotnet publish src/ObservatorySafety.Watchdog/ObservatorySafety.Watchdog.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          /p:Version=$env:MSI_VERSION `
          /p:FileVersion=$env:MSI_VERSION `
          /p:AssemblyVersion=$env:MSI_VERSION `
          /p:PublishSingleFile=false `
          --output src/ObservatorySafety.Watchdog/publish-msi

    - name: Generate version files
      shell: pwsh
      run: |
        "Version=$env:MSI_VERSION" | Out-File src/ObservatorySafety.Service/publish-msi/appsettings.version -Encoding ascii
        "Version=$env:MSI_VERSION" | Out-File src/ObservatorySafety.Watchdog/publish-msi/appsettings.version -Encoding ascii

    - name: Decode PFX certificate
      shell: pwsh
      run: |
        echo "$env:SIGNING_CERT" | Out-File cert.b64
        certutil -decode cert.b64 cert.pfx
      env:
        SIGNING_CERT: ${{ secrets.SIGNING_CERT }}

    - name: Sign EXEs
      shell: pwsh
      run: |
        $kitPath = "C:\Program Files (x86)\Windows Kits\10\bin"
        $signtool = Get-ChildItem -Path $kitPath -Recurse -Filter signtool.exe |
                    Where-Object { $_.FullName -like "*x64*" } |
                    Select-Object -First 1

        & $signtool.FullName sign `
          /f cert.pfx `
          /p $env:SIGNING_CERT_PASSWORD `
          /tr http://timestamp.digicert.com `
          /td sha256 `
          /fd sha256 `
          src/ObservatorySafety.Service/publish-msi/ObservatorySafety.Service.exe

        & $signtool.FullName sign `
          /f cert.pfx `
          /p $env:SIGNING_CERT_PASSWORD `
          /tr http://timestamp.digicert.com `
          /td sha256 `
          /fd sha256 `
          src/ObservatorySafety.Watchdog/publish-msi/ObservatorySafety.Watchdog.exe
      env:
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    - name: Generate MSI installers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path wix/generated -Force | Out-Null

        $servicePath = "src/ObservatorySafety.Service/publish-msi"
        $watchdogPath = "src/ObservatorySafety.Watchdog/publish-msi"

        $serviceExe = "$servicePath/ObservatorySafety.Service.exe"
        $watchdogExe = "$watchdogPath/ObservatorySafety.Watchdog.exe"

        $servicePayload = "$servicePath/payload"
        $watchdogPayload = "$watchdogPath/payload"

        New-Item -ItemType Directory -Path $servicePayload -Force | Out-Null
        New-Item -ItemType Directory -Path $watchdogPayload -Force | Out-Null

        Get-ChildItem $servicePath -File |
          Where-Object { $_.Name -ne "ObservatorySafety.Service.exe" -and $_.Name -ne "appsettings.json" -and $_.Name -ne "appsettings.version" } |
          ForEach-Object { Move-Item $_.FullName $servicePayload -Force }

        Get-ChildItem $watchdogPath -File |
          Where-Object { $_.Name -ne "ObservatorySafety.Watchdog.exe" -and $_.Name -ne "appsettings.json" -and $_.Name -ne "appsettings.version" } |
          ForEach-Object { Move-Item $_.FullName $watchdogPayload -Force }

        $serviceJson = Join-Path $servicePayload "appsettings.json"
        if (Test-Path $serviceJson) { Remove-Item $serviceJson -Force }

        $watchdogJson = Join-Path $watchdogPayload "appsettings.json"
        if (Test-Path $watchdogJson) { Remove-Item $watchdogJson -Force }

        heat dir $servicePayload -gg -sreg -scom -sfrag -srd -dr INSTALLDIR -cg ServiceComponents -out wix/generated/ServiceComponents.wxs
        heat dir $watchdogPayload -gg -sreg -scom -sfrag -srd -dr INSTALLDIR -cg WatchdogComponents -out wix/generated/WatchdogComponents.wxs

        candle `
          -dServiceExePath="$serviceExe" `
          -dServiceConfigPath="$servicePath/appsettings.json" `
          -dServiceVersionPath="$servicePath/appsettings.version" `
          wix/Product.Service.wxs wix/generated/ServiceComponents.wxs `
          -o wix/generated/

        candle `
          -dWatchdogExePath="$watchdogExe" `
          -dWatchdogConfigPath="$watchdogPath/appsettings.json" `
          -dWatchdogVersionPath="$watchdogPath/appsettings.version" `
          wix/Product.Watchdog.wxs wix/generated/WatchdogComponents.wxs `
          -o wix/generated/

        light -b $servicePayload wix/generated/Product.Service.wixobj wix/generated/ServiceComponents.wixobj -o publish/ObservatorySafety.Service.msi
        light -b $watchdogPayload wix/generated/Product.Watchdog.wixobj wix/generated/WatchdogComponents.wixobj -o publish/ObservatorySafety.Watchdog.msi

    - name: Sign MSIs
      shell: pwsh
      run: |
        $kitPath = "C:\Program Files (x86)\Windows Kits\10\bin"
        $signtool = Get-ChildItem -Path $kitPath -Recurse -Filter signtool.exe |
                    Where-Object { $_.FullName -like "*x64*" } |
                    Select-Object -First 1

        & $signtool.FullName sign `
          /f cert.pfx `
          /p $env:SIGNING_CERT_PASSWORD `
          /tr http://timestamp.digicert.com `
          /td sha256 `
          /fd sha256 `
          publish/ObservatorySafety.Service.msi

        & $signtool.FullName sign `
          /f cert.pfx `
          /p $env:SIGNING_CERT_PASSWORD `
          /tr http://timestamp.digicert.com `
          /td sha256 `
          /fd sha256 `
          publish/ObservatorySafety.Watchdog.msi
      env:
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    - name: Upload MSIs
      uses: actions/upload-artifact@v4
      with:
        name: ObservatorySafety-MSIs
        path: |
          publish/ObservatorySafety.Service.msi
          publish/ObservatorySafety.Watchdog.msi

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ObservatorySafety-MSIs
        path: ./release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: ObservatorySafety v1.0.${{ github.run_number }}
        files: |
          ./release/ObservatorySafety.Service.msi
          ./release/ObservatorySafety.Watchdog.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
